name: Windows build and regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Regression and Windows integration checks
        run: ./test.ps1
      - name: Build self-contained x64 application
        run: ./build.ps1 -Runtime win-x64
      - name: Package portable application
        run: Compress-Archive -Path dist/win-x64/* -DestinationPath dist/ClipKeep-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClipKeep-windows-x64
          path: windows/dist/ClipKeep-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
